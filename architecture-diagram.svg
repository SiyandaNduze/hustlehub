<svg viewBox="0 0 1300 860" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1300" height="860" fill="#fff"/>
  <text x="650" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">HustleHub+ - Final System Architecture</text>
  <text x="650" y="54" text-anchor="middle" font-size="12.5" fill="#6b7280">Docker Compose stack, security controls, logging pipeline and CI/CD</text>

  <!-- Browser -->
  <rect x="25" y="80" width="230" height="470" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="140" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">UNTRUSTED: Browser / Internet</text>
  <rect x="42" y="120" width="196" height="250" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="140" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">React SPA</text>
  <text x="140" y="168" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Login / Register / Gigs</text>
  <text x="140" y="184" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Bookings / Admin</text>
  <text x="140" y="204" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">Income + tax dashboard</text>
  <text x="140" y="220" text-anchor="middle" font-size="10.5" fill="#1e3a8a">SVG charts (no inline styles)</text>
  <text x="140" y="244" text-anchor="middle" font-size="10.5" fill="#1e3a8a">JWT in sessionStorage</text>
  <text x="140" y="260" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Logout revokes token server-side</text>
  <text x="140" y="284" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Client validation (UX only)</text>
  <text x="140" y="300" text-anchor="middle" font-size="10.5" fill="#1e3a8a">React output encoding (XSS)</text>
  <text x="140" y="340" text-anchor="middle" font-size="10" fill="#475569">Vitest + Testing Library</text>
  <rect x="42" y="390" width="196" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="140" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Newman / Postman</text>
  <text x="140" y="436" text-anchor="middle" font-size="10.5" fill="#1e3a8a">94-request API + security suite</text>
  <text x="140" y="452" text-anchor="middle" font-size="10" fill="#475569">run locally and in CI</text>

  <line x1="255" y1="230" x2="318" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="318" y1="262" x2="255" y2="262" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="286" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">HTTPS</text>
  <text x="286" y="278" text-anchor="middle" font-size="9" fill="#6b7280">:8443</text>

  <!-- Docker compose boundary -->
  <rect x="318" y="72" width="660" height="700" rx="12" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="648" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0369a1">DOCKER COMPOSE STACK (internal network)</text>

  <!-- nginx -->
  <rect x="338" y="108" width="620" height="92" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="648" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">frontend container - nginx (TLS 1.2/1.3)</text>
  <text x="648" y="150" text-anchor="middle" font-size="10.5" fill="#075985">Serves the Vite build · CSP, nosniff, X-Frame-Options, HSTS headers · SPA fallback</text>
  <text x="648" y="168" text-anchor="middle" font-size="10.5" fill="#075985">Reverse-proxies /api to the backend and forwards the real client IP (X-Forwarded-For)</text>
  <text x="648" y="186" text-anchor="middle" font-size="10" fill="#0369a1">healthcheck · depends_on: backend healthy</text>
  <line x1="648" y1="200" x2="648" y2="218" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="662" y="213" font-size="9.5" fill="#6b7280">HTTPS (internal)</text>

  <!-- Backend boundary -->
  <rect x="338" y="220" width="620" height="535" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="648" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">backend container - Node 22 / Express (non-root, cap_drop ALL, no-new-privileges)</text>

  <rect x="355" y="252" width="586" height="46" rx="7" fill="#fee2e2" stroke="#dc2626"/>
  <text x="648" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">Perimeter</text>
  <text x="648" y="289" text-anchor="middle" font-size="10" fill="#7f1d1d">Request ID + access log · Helmet/CSP · CORS allow-list · 10kb body limit · key stripping · API rate limit</text>

  <rect x="355" y="308" width="286" height="62" rx="7" fill="#fff7ed" stroke="#ea580c"/>
  <text x="498" y="328" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">Auth routes</text>
  <text x="498" y="344" text-anchor="middle" font-size="10" fill="#7c2d12">register · login · logout</text>
  <text x="498" y="359" text-anchor="middle" font-size="9.5" fill="#9a3412">auth rate limit · account lockout · common-password check</text>
  <rect x="655" y="308" width="286" height="62" rx="7" fill="#fff7ed" stroke="#ea580c"/>
  <text x="798" y="328" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">Marketplace routes</text>
  <text x="798" y="344" text-anchor="middle" font-size="10" fill="#7c2d12">gigs · bookings · transactions · income · admin</text>
  <text x="798" y="359" text-anchor="middle" font-size="9.5" fill="#9a3412">booking rate limit · validation</text>

  <rect x="355" y="380" width="586" height="50" rx="7" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="648" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">requireAuth (JWT HS256, user lookup, token-version check) → requireRole (RBAC) → ownership checks</text>
  <text x="648" y="418" text-anchor="middle" font-size="10" fill="#4338ca">role read from the store, never from the token · revoked tokens rejected</text>

  <rect x="355" y="440" width="286" height="92" rx="7" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="498" y="460" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#312e81">Controllers</text>
  <text x="498" y="478" text-anchor="middle" font-size="10" fill="#312e81">auth · gigs · bookings · income · admin</text>
  <text x="498" y="494" text-anchor="middle" font-size="10" fill="#312e81">server-side prices · allow-listed fields</text>
  <text x="498" y="512" text-anchor="middle" font-size="9.5" fill="#4338ca">generic error handler + request id</text>
  <rect x="655" y="440" width="286" height="92" rx="7" fill="#ecfdf5" stroke="#059669"/>
  <text x="798" y="460" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#064e3b">Services (pure, unit tested)</text>
  <text x="798" y="478" text-anchor="middle" font-size="10" fill="#064e3b">taxService: SARS brackets, rebate,</text>
  <text x="798" y="493" text-anchor="middle" font-size="10" fill="#064e3b">effective/marginal rate, monthly + per-gig</text>
  <text x="798" y="511" text-anchor="middle" font-size="10" fill="#064e3b">ledger: SHA-256 hash chain · lockout tracker</text>

  <rect x="355" y="542" width="286" height="50" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="498" y="562" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">bcrypt (12 rounds) · JWT utility</text>
  <text x="498" y="579" text-anchor="middle" font-size="10" fill="#14532d">no plain-text passwords</text>
  <rect x="655" y="542" width="286" height="50" rx="7" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="798" y="562" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#713f12">Structured logger</text>
  <text x="798" y="579" text-anchor="middle" font-size="10" fill="#713f12">JSON lines · secrets redacted · emails masked</text>

  <rect x="355" y="604" width="586" height="62" rx="7" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="648" y="626" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Data layer: JSON collections on a named volume (/data)</text>
  <text x="648" y="644" text-anchor="middle" font-size="10" fill="#1f2937">users · gigs · bookings · transactions (hash-chained)</text>
  <text x="648" y="658" text-anchor="middle" font-size="9.5" fill="#6b7280">only models/ touches storage → replaceable by MongoDB</text>

  <rect x="355" y="678" width="586" height="62" rx="7" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="648" y="698" text-anchor="middle" font-size="11" font-weight="bold" fill="#701a75">Volumes: hustlehub-data · hustlehub-logs · hustlehub-certs</text>
  <text x="648" y="716" text-anchor="middle" font-size="10" fill="#701a75">self-signed TLS certificate created at first start · admin seeded from env</text>
  <text x="648" y="731" text-anchor="middle" font-size="9.5" fill="#86198f">healthcheck on /api/health · json-file log rotation</text>

  <line x1="648" y1="298" x2="648" y2="308" stroke="#374151" marker-end="url(#a)"/>
  <line x1="498" y1="370" x2="498" y2="380" stroke="#374151" marker-end="url(#a)"/>
  <line x1="798" y1="370" x2="798" y2="380" stroke="#374151" marker-end="url(#a)"/>
  <line x1="648" y1="430" x2="648" y2="440" stroke="#374151" marker-end="url(#a)"/>
  <line x1="648" y1="532" x2="648" y2="542" stroke="#374151" marker-end="url(#a)"/>
  <line x1="648" y1="592" x2="648" y2="604" stroke="#374151" marker-end="url(#a)"/>

  <!-- Logging pipeline -->
  <rect x="1000" y="72" width="280" height="330" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="1140" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#713f12">MONITORING</text>
  <text x="1140" y="116" text-anchor="middle" font-size="10.5" fill="#713f12">Events: login success/failure/lockout,</text>
  <text x="1140" y="131" text-anchor="middle" font-size="10.5" fill="#713f12">register, logout, token rejected, access</text>
  <text x="1140" y="146" text-anchor="middle" font-size="10.5" fill="#713f12">denied, gig CRUD, booking, transaction,</text>
  <text x="1140" y="161" text-anchor="middle" font-size="10.5" fill="#713f12">rate limit hit, validation, errors, ledger</text>
  <rect x="1020" y="178" width="240" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="1140" y="203" text-anchor="middle" font-size="11" fill="#78350f">stdout → docker logs</text>
  <rect x="1020" y="228" width="240" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="1140" y="253" text-anchor="middle" font-size="11" fill="#78350f">/logs/app.log (volume)</text>
  <rect x="1020" y="278" width="240" height="56" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="1140" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">HTTPS batch shipper</text>
  <text x="1140" y="318" text-anchor="middle" font-size="10" fill="#78350f">Bearer token · never blocks requests</text>
  <rect x="1020" y="350" width="240" height="40" rx="6" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <text x="1140" y="375" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#78350f">Cloud logs (Better Stack)</text>
  <line x1="941" y1="573" x2="1000" y2="300" stroke="#9ca3af" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <!-- CI/CD -->
  <rect x="1000" y="425" width="280" height="345" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1140" y="449" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">GitHub Actions CI/CD</text>
  <rect x="1018" y="462" width="244" height="64" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1140" y="482" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">backend job</text>
  <text x="1140" y="499" text-anchor="middle" font-size="10" fill="#14532d">npm ci · ESLint security · unit tests</text>
  <text x="1140" y="514" text-anchor="middle" font-size="10" fill="#14532d">npm audit (fail on high)</text>
  <rect x="1018" y="536" width="244" height="50" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1140" y="556" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">frontend job</text>
  <text x="1140" y="573" text-anchor="middle" font-size="10" fill="#14532d">npm ci · Vitest · build · audit</text>
  <rect x="1018" y="596" width="244" height="64" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1140" y="616" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">docker-stack job</text>
  <text x="1140" y="633" text-anchor="middle" font-size="10" fill="#14532d">build both images · compose up --wait</text>
  <text x="1140" y="648" text-anchor="middle" font-size="10" fill="#14532d">Newman suite against containers</text>
  <rect x="1018" y="670" width="244" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1140" y="695" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">CodeQL (SAST) workflow</text>
  <text x="1140" y="738" text-anchor="middle" font-size="10" fill="#166534">Any failing step fails the pipeline</text>
  <text x="1140" y="754" text-anchor="middle" font-size="10" fill="#166534">Artifacts: reports, logs, build</text>

  <text x="650" y="815" text-anchor="middle" font-size="10.5" fill="#6b7280">Dashed boxes are trust or deployment boundaries. Authentication, authorisation, validation, rate limiting and logging are enforced server-side on every request.</text>
  <text x="650" y="833" text-anchor="middle" font-size="10.5" fill="#6b7280">Only the frontend container is published to the host (port 8443); the API is reachable only through nginx.</text>
</svg>
